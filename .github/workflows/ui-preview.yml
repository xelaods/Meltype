name: ui-preview

# 画面のリデザインの確認用: ビルドして、各画面を画像にして保存する (Actions の Artifacts から見られる)。
on:
  push:
    branches: [redesign-ui]
  workflow_dispatch:

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Meltype.sln -c Release
      - name: Render forms
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ui-preview | Out-Null
          dotnet run --project src/Meltype.Tests/Meltype.Tests.csproj -c Release --no-build -- --render-forms "$PWD/ui-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: ui-preview/*.png
